<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    body{ margin: 0; }
    div{ display: none; }
    ul{
        margin: 0;
        padding: 0;
        background-color: #FCC;
    }
    ul li{
        display: inline-block;
        padding: 5px 10px;
        margin: 5px;
        background-color: #CCC;
    }
    @media all and (max-width:400px){ /* Até 400px de largura */
        div{
            display: block;
            width: 36px;
            line-height: 36px;
            text-align: center;
            background-color: #CFC;
        }
        ul{
            position: absolute;
            width: 100%;
            left:-100vw;
            transition: 1s;
        }
        ul.ativo{left: 0;}
        ul li{
            display: block;
        }
    }
    @media all and (min-width: 600px){ /* Maior do que 600px de largura */
        body{
            background-color: #CCF;
        }
    }

    @media (orientation: portrait){ /* Retrato - Dispositivo em pé */
        ul li{background-color: #F66;}
    }

    @media (orientation: landscape){ /* Paisagem - Dispositivo deitado */
        ul li{background-color: #6F6;}
    }

</style>
<div>ICO</div>
<ul>
    <li>Menu</li>
    <li>Menu</li>
    <li>Menu</li>
    <li>Menu</li>
    <li>Menu</li>
</ul>
<script>
var ico = document.querySelector("div");
var menu = document.querySelector("ul");

ico.addEventListener("click", () => {
    menu.classList.toggle("ativo");
});
menu.addEventListener("click", () => {
    menu.classList.remove("ativo");
});
</script>
