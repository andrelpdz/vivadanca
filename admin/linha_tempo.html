<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linha do Tempo | Gerenciar</title>
    <link rel="stylesheet" href="../assets/css/fernanda.css">
</head>
<body>
    <main class="admin-main">
        <!-- TOPO -->
        <header></header>

        <!-- CADASTRO -->
        <section class="integrantes-painel">
            <h2>Cadastrar na Linha do Tempo</h2>
            <form class="form-integrantes" action="../backend/api_linha_tempo.php" method="POST" enctype="multipart/form-data">
                <input type="hidden" id="id" name="id" value="">

                <label for="descricao">Descrição</label>
                <textarea id="descricao" name="descricao" required></textarea>

                <label for="data">Ano</label>
                <select id="data" name="data" required style="width: 100%; padding: 13px; margin-bottom: 15px; border: 1px solid #e1e5ec; border-radius: 8px; font-family: inherit;">
                    <option value="">Selecione o ano</option>
                </select>

                <label for="foto">Foto</label>
                <input type="file" id="foto" name="foto" accept="image/*" required>

                <input type="submit" id="btnEnviar" name="btnEnviar" class="integrantes-btn" value="Cadastrar">
            </form>
        </section>

        <section class="integrantes-painel">
            <h2>Itens da Linha do Tempo</h2>
            <div id="linha_tempo"></div>
        </section>
    </main>
    <script src="../assets/js/admin.js"></script>
    <script src="../assets/js/linha_tempo.js"></script>
    <script>
        popularAnosSelect();
        popularCards();
    </script>
</body>
</html>
