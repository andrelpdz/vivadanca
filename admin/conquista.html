<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conquistas | Gerenciar</title>
    <link rel="stylesheet" href="../assets/css/fernanda.css">
</head>
<body>
    <main class="admin-main">
        <!-- TOPO -->
        <header></header>

        <!-- CADASTRO -->
        <header>
            <div>
                <span>PAINEL ADMINISTRATIVO</span>
                <h1>Gerenciar <em>Conquistas</em></h1>
                <p>Cadastre e vincule conquistas a eventos e coreografias.</p>
            </div>
        </header>

        <section class="integrantes-painel">
            <h2>Cadastrar Conquista</h2>
            <p>Preencha os dados da conquista abaixo.</p>

            <form class="form-integrantes" action="../backend/api_conquista.php" method="POST" enctype="multipart/form-data">
                <input type="hidden" id="id" name="id" value="">

                <label for="evento_id">Evento</label>
                <select id="evento_id" name="evento_id" required>
                    <option value="">Selecione um evento</option>
                </select>

                <label for="coreografia_id">Coreografia</label>
                <select id="coreografia_id" name="coreografia_id" required>
                    <option value="">Selecione uma coreografia</option>
                </select>

                <label for="nome">Nome da Conquista</label>
                <input type="text" id="nome" name="nome" placeholder="Digite o nome da conquista" required>

                <label for="descricao">Descrição</label>
                <textarea id="descricao" name="descricao" placeholder="Digite uma descrição"></textarea>

                <label for="foto">Foto/Troféu</label>
                <input type="file" id="foto" name="foto" accept="image/*">

                <input type="submit" id="btnEnviar" name="btnEnviar" class="integrantes-btn" value="Cadastrar">
            </form>
        </section>

        <section class="integrantes-painel">
            <h2>Conquistas Cadastradas</h2>
            <p>Visualize e gerencie as conquistas registradas.</p>
            <div id="conquistas" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px;"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Viva Dança</p>
        <div>
            <a href="#">Privacidade</a>
            <a href="#">Termos</a>
            <a href="#">Ajuda</a>
        </div>
    </footer>

    <script src="../assets/js/admin.js"></script>
    <script src="../assets/js/conquista.js"></script>
    <script>inicializarPagina();</script>
</body>
</html>
