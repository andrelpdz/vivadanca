<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conquistas | Gerenciar</title>
    <link rel="stylesheet" href="../assets/css/fernanda.css">
</head>
<body>
    <main class="admin-main">
        <!-- TOPO -->
        <header></header>

        <!-- CADASTRO -->
        <section class="integrantes-painel">
            <h2>Cadastrar Conquista</h2>
            <form class="form-integrantes" action="../backend/api_conquista.php" method="POST" enctype="multipart/form-data">
                <input type="hidden" id="id" name="id" value="">

                <label for="evento_id">ID do Evento</label>
                <input type="number" id="evento_id" name="evento_id" required>

                <label for="coreografia_id">ID da Coreografia</label>
                <input type="number" id="coreografia_id" name="coreografia_id" required>

                <label for="nome">Nome da Conquista</label>
                <input type="text" id="nome" name="nome" required>

                <label for="descricao">Descrição</label>
                <textarea id="descricao" name="descricao"></textarea>

                <label for="foto">Foto/Troféu</label>
                <input type="file" id="foto" name="foto" accept="image/*" required>

                <input type="submit" id="btnEnviar" name="btnEnviar" class="integrantes-btn" value="Cadastrar">
            </form>
        </section>

        <section class="integrantes-painel">
            <h2>Conquistas Cadastradas</h2>
            <div id="conquistas"></div>
        </section>
    </main>
    <script src="../assets/js/admin.js"></script>
    <script src="../assets/js/conquista.js"></script>
    <script>popularCards();</script>
</body>
</html>
