<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria | Gerenciar</title>
    <link rel="stylesheet" href="../assets/css/fernanda.css">
    <link rel="stylesheet" href="../assets/css/admin-galeria.css">
</head>
<body data-admin-collection="galeria">
    <main class="admin-main">
        <!-- TOPO -->
        <header></header>

        <!-- CADASTRO -->
        <section class="integrantes-painel">
            <h2>Cadastrar na Galeria</h2>
            <form class="form-integrantes" action="../backend/api_galeria.php" method="POST" enctype="multipart/form-data">
                <input type="hidden" id="id" name="id" value="">

                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" maxlength="255" required>

                <label for="descricao">Descrição</label>
                <textarea id="descricao" name="descricao" required></textarea>

                <label for="data_foto">Data da foto</label>
                <input type="date" id="data_foto" name="data_foto" min="1000-01-01" max="9999-12-31">

                <label for="foto">Foto</label>
                <input type="file" id="foto" name="foto" accept="image/*" required>

                <input type="submit" id="btnEnviar" name="btnEnviar" class="integrantes-btn" value="Cadastrar">
            </form>
        </section>

        <section class="integrantes-painel">
            <h2>Itens na Galeria</h2>
            <div id="galeria"></div>
        </section>
    </main>
    <script src="../assets/js/admin.js?v=20261118-1"></script>
    
</body>
</html>
