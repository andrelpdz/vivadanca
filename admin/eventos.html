<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Eventos</title>
    <link rel="stylesheet" href="../assets/css/fernanda.css">
</head>
<body>

    <main class="eventos">
        <img src="../assets/img/logo.png" alt="Viva Dança" width="130">

        <h1>Cadastro de <span>Eventos</span></h1>
        <p>Cadastre os eventos do Viva Dança.</p>

        <form id="formEvento" action="../backend/registro_evento.php" method="POST">
            <h2>Novo evento</h2>

            <input type="hidden" id="id" name="id">

            <label>Nome do evento</label>
            <input type="text" id="nome" name="nome" placeholder = "Nome do evento" required>

            <label>Descrição</label>
            <input type="text" id="descricao" name="descricao" placeholder = "Descrição do evento" required>

            <label>Data de início</label>
            <input type="datetime-local" id="data_inicio" name= "data_inicio" required>

            <label>Data de término</label>
            <input type="datetime-local" id="data_termino" name= "data_termino" required>

            <label>Cidade</label>
            <input type="text" id="cidade" name = "cidade" placeholder = "Cidade">

            <label>Local</label>
            <input type="text" id="local" name = "local" placeholder = "Local do evento">

            <label>Premiação</label>
            <input type="text" id="premiacao" name = "premiacao" placeholder = "Premiação do evento">

            <input type="hidden" id= "listaIntegrantes" name="listaIntegrantes" value = "">
            
            <button type="submit" id="btnEnviar" value = "Cadastrar Evento">Cadastrar Evento</button>
        </form>

        <hr>
        <section id="eventos">

        </section>


        <nav>
            <a href="cadastro_integrante.html">Integrantes</a>
            <a href="cadastro_conquista.html">Conquistas</a>
            <a href="cadastro_coreografia.html">Coreografias</a>
        </nav>
    </main>

    <footer>
        <p>&copy; 2026 Viva Dança</p>
        <div>
            <a href="#">Privacidade</a>
            <a href="#">Termos</a>
            <a href="#">Ajuda</a>
        </div>
    </footer>

    <script src="../assets/js/integrantes.js"></script>
    <script src="../assets/js/eventos.js"></script>

    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
       popularCardsEventosAdmin();
    </script>

  
</body>

</html>
