<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Eventos</title>
    <link rel="stylesheet" href="../assets/css/fernanda.css">
</head>
<body>

    <main class="eventos">
        <img src="../assets/img/logo.png" alt="Viva Dança" width="130">

        <h1>Cadastro de <span>Eventos</span></h1>
        <p>Cadastre os eventos do Viva Dança.</p>

        <form action="../backend/registro_evento.php" method="POST">
            <h2>Novo evento</h2>

            <label>Nome do evento</label>
            <input type="text" name="nome" required>

            <label>Descrição</label>
            <input type="text" name="descricao" required>

            <label>Data de início</label>
            <input type="datetime-local" name="data_inicio" required>

            <label>Data de término</label>
            <input type="datetime-local" name="data_termino" required>

            <label>Cidade</label>
            <input type="text" name="cidade" required>

            <label>Local</label>
            <input type="text" name="local" required>

            <label>Premiação</label>
            <input type="text" name="premiacao">

            <button type="submit">Cadastrar Evento</button>
        </form>

        <nav>
            <a href="cadastro_integrante.html">Integrantes</a>
            <a href="cadastro_conquista.html">Conquistas</a>
            <a href="cadastro_coreografia.html">Coreografias</a>
        </nav>
    </main>

    <footer>
        <p>&copy; 2026 Viva Dança</p>
        <div>
            <a href="#">Privacidade</a>
            <a href="#">Termos</a>
            <a href="#">Ajuda</a>
        </div>
    </footer>

</body>
  <section id="eventos" aria-live="polite"></section>
</body>
    <script src="../assets/js/admin.js"></script>
    <script src="../assets/js/eventos.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", popularCardsEventosAdmin);
    </script>  



</html>
