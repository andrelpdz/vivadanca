<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integrantes | Gerenciar</title>
    <link rel="stylesheet" href="../assets/css/fernanda.css">
</head>

<body>
    <main>
        <!-- TOPO -->
        <header>


        </header>
      

        <!-- CADASTRO -->
        <section class="integrantes-painel">

            <h2>Cadastrar integrante</h2>
            <p>Preencha os dados do integrante abaixo.</p>

            <form class="form-integrantes"
                  action="../backend/api_integrante.php"
                  method="POST"
                  enctype="multipart/form-data">

                <input type="hidden" id="id" name="id" value="">

                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome"
                       placeholder="Digite o nome" required>

                <label for="descricao">Descrição</label>
                <textarea id="descricao" name="descricao"
                       placeholder="Digite uma descrição" required></textarea>

                <label for="foto">Foto do integrante</label>
                <input type="file" id="foto" name="foto" accept="image/*">

                <label class="integrantes-ativo">
                    <input type="checkbox" id="ativo" name="ativo" checked>
                    Integrante ativo
                </label>

                <input type="submit" id="btnEnviar"
                       class="integrantes-btn" value="Cadastrar">

            </form>
        </section>

        <!-- LISTAGEM -->
        <section class="integrantes-painel">

            <h2>Integrantes cadastrados</h2>
            <p>Visualize e gerencie os integrantes cadastrados.</p>

            <div id="integrantes"></div>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Viva Dança</p>

        <div>
            <a href="#">Privacidade</a>
            <a href="#">Termos</a>
            <a href="#">Ajuda</a>
        </div>
    </footer>
    <script src="../assets/js/admin.js"></script>
    <script src="../assets/js/integrantes.js"></script>
    <script>
        popularCardsIntegrantesAdmin();
    </script>

</body>
</html>
